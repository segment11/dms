<div ng-controller="MainCtrl">
    <div class="container-fluid">

        <div class="row-fluid">

            <div class="widget-box">
                <div class="widget-title">
                    <span class="icon"><i class="icon-info"></i></span>
                    <h5>Kafka Service List</h5>
                    <div class="actions">
                        <button class="btn" ng-click="goAddOne()">Add One</button>
                        <button class="btn btn-gray" ng-click="initExporters()">Init Exporters / Prometheus</button>
                    </div>
                </div>
                <div class="widget-content">
                    <div class="form-group">
                        <label>Mode: </label>
                        <select ng-model="tmp.mode" style="width: 100px;">
                            <option value="" selected>--/--</option>
                            <option value="standalone">standalone</option>
                            <option value="cluster">cluster</option>
                        </select>
                        <label>Status: </label>
                        <select ng-model="tmp.status" style="width: 120px;">
                            <option value="" selected>--/--</option>
                            <option value="creating">creating</option>
                            <option value="running">running</option>
                            <option value="scaling_up">scaling_up</option>
                            <option value="scaling_down">scaling_down</option>
                            <option value="stopped">stopped</option>
                            <option value="unhealthy">unhealthy</option>
                            <option value="deleted">deleted</option>
                        </select>
                        <label>Keyword Filter: </label>
                        <input type="text" ng-model="tmp.keyword" placeholder="Input Keyword"/>
                        <button class="btn" ng-click="queryLl()">Query</button>
                    </div>
                    <table class="table table-bordered table-striped">
                        <tr>
                            <th width="5%">id</th>
                            <th width="15%">name</th>
                            <th width="10%">mode</th>
                            <th width="10%">version</th>
                            <th width="10%">brokers</th>
                            <th width="15%">status</th>
                            <th width="15%">updated date</th>
                            <th></th>
                        </tr>
                        <tr ng-repeat="one in ll">
                            <td>{{one.id}}</td>
                            <td title="{{one.des}}">
                                {{one.name}}
                            </td>
                            <td>{{one.mode}}</td>
                            <td>{{one.kafkaVersion}}</td>
                            <td>
                                <span class="bg-info">Brokers: {{one.brokers}}</span>
                                <span class="bg-info">Port: {{one.port}}</span>
                            </td>
                            <td><span
                                    ng-class="{'bg-info': 'creating' == one.status, 'bg-success': 'running' == one.status, 'bg-tips': 'deleted' == one.status, 'bg-danger': 'unhealthy' == one.status, 'bg-gray': 'stopped' == one.status}">{{one.status}}</span>
                            </td>
                            <td>{{one.updatedDate | date:'yyyy/MM/dd HH:mm:ss'}}</td>
                            <td class="opts">
                                <div class="btn-line">
                                    <button class="btn" ng-click="goServiceOne(one)"
                                            ng-show="one.status != 'deleted'">Detail
                                    </button>
                                </div>
                                <div class="btn-line">
                                    <button class="btn" ng-click="stop(one)"
                                            ng-show="one.status == 'running'">Stop
                                    </button>
                                    <button class="btn" ng-click="start(one)"
                                            ng-show="one.status == 'stopped'">Start
                                    </button>
                                </div>
                                <div class="btn-line">
                                    <button class="btn btn-red" ng-click="delete(one)"
                                            ng-show="one.status != 'deleted'">Delete
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </table>
                    <div style="margin-top: 6px;" ui-pagi="" pager="pager" on-change-page="queryLl(cp, event)"></div>
                </div>
            </div>


        </div><!-- /.row-fluid -->
    </div>
</div>
