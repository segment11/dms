<div ng-controller="MainCtrl">

    <div class="container-fluid">

        <div class="row-fluid">

            <div class="widget-box">
                <div class="widget-title">
                    <span class="icon"><i class="icon-info"></i></span>
                    <h5>Kafka Service - {{params.serviceName}} - Snapshot List</h5>
                    <div class="actions">
                        <button class="btn btn-gray" ng-click="queryLl()">Refresh</button>
                        <button class="btn btn-blue" ng-click="showImport()">Import</button>
                        <button class="btn" ng-click="exportSnapshot()">Export</button>
                        <button class="btn btn-gray" ng-click="back()">Back</button>
                    </div>
                </div>
                <div class="widget-content">
                    <table class="table table-bordered table-striped">
                        <tr>
                            <th width="8%">id</th>
                            <th width="15%">name</th>
                            <th width="10%">status</th>
                            <th width="20%">snapshot dir</th>
                            <th width="8%">cost ms</th>
                            <th width="20%">message</th>
                            <th width="10%">created date</th>
                            <th width="9%"></th>
                        </tr>
                        <tr ng-repeat="one in ll">
                            <td>{{one.id}}</td>
                            <td>{{one.name}}</td>
                            <td>
                                <span ng-class="{'bg-info': 'created' == one.status, 'bg-success': 'done' == one.status, 'bg-danger': 'failed' == one.status}">{{one.status}}</span>
                            </td>
                            <td>{{one.snapshotDir}}</td>
                            <td>{{one.costMs}}</td>
                            <td>{{one.message}}</td>
                            <td>{{one.createdDate | date:'yyyy/MM/dd HH:mm:ss'}}</td>
                            <td class="opts">
                                <div class="btn-line">
                                    <button class="btn" ng-click="download(one)">Download</button>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>

        </div><!-- /.row-fluid -->

    </div>

    <script type="text/x-template"
            ui-dialog="{showModel: 'ctrl.isShowImport', title: 'Import Kafka Snapshot', dialogId: 'dialogKafkaSnapshotImport', lock: true, fixed: true, ext: {max: false}}">
        <table class="table table-bordered table-striped m_top6" style="width: 600px;" ng-form="tmp.addForm">
            <tr>
                <td width="30%">Snapshot Path</td>
                <td>
                    <input type="text" ng-model="editOne.snapshotPath" ui-valid="r"
                           placeholder="Input Snapshot Path"/>
                </td>
            </tr>
            <tr>
                <td>Zk Connect String</td>
                <td>
                    <input type="text" ng-model="editOne.zkConnectString" ui-valid="r"
                           placeholder="Input Zk Connect String"/>
                </td>
            </tr>
            <tr>
                <td>Zk Chroot</td>
                <td>
                    <input type="text" ng-model="editOne.zkChroot"
                           placeholder="Optional, eg. /kafka/my-cluster"/>
                </td>
            </tr>
        </table>
        <button class="btn btn-blue" ng-click="saveImport()">Save</button>
        <button class="btn" ng-click="ctrl.isShowImport = false">Close</button>
    </script>
</div>
