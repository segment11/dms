<div ng-controller="MainCtrl">
    <div class="container-fluid">

        <div class="row-fluid">

            <div class="widget-box">
                <div class="widget-title">
                    <span class="icon"><i class="icon-info"></i></span>
                    <h5>Kafka Topic List<span ng-show="tmp.serviceName"> - {{tmp.serviceName}}</span></h5>
                    <div class="actions">
                        <button class="btn" ng-click="goAddOne()">Add One</button>
                        <button class="btn btn-gray" ng-click="queryLl()">Refresh</button>
                    </div>
                </div>
                <div class="widget-content">
                    <table class="table table-bordered table-striped">
                        <tr>
                            <th width="20%">name</th>
                            <th width="10%">partitions</th>
                            <th width="10%">replication factor</th>
                            <th width="10%">status</th>
                            <th width="10%">config overrides</th>
                            <th width="15%">updated date</th>
                            <th></th>
                        </tr>
                        <tr ng-repeat="one in ll">
                            <td>{{one.name}}</td>
                            <td>{{one.partitions}}</td>
                            <td>{{one.replicationFactor}}</td>
                            <td>
                                <span ng-class="{'bg-info': 'creating' == one.status, 'bg-success': 'active' == one.status, 'bg-danger': 'deleting' == one.status, 'bg-tips': 'deleted' == one.status}">{{one.status}}</span>
                            </td>
                            <td>{{configCount(one)}}</td>
                            <td>{{one.updatedDate | date:'yyyy/MM/dd HH:mm:ss'}}</td>
                            <td class="opts">
                                <div class="btn-line">
                                    <button class="btn" ng-click="goTopicOne(one)">Detail
                                    </button>
                                </div>
                                <div class="btn-line">
                                    <button class="btn" ng-click="showAlter(one)">Alter</button>
                                </div>
                                <div class="btn-line">
                                    <button class="btn btn-red" ng-click="deleteTopic(one)">Delete
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>

        </div><!-- /.row-fluid -->
    </div>

    <script type="text/x-template"
            ui-dialog="{showModel: 'ctrl.isShowAdd', title: 'Add Kafka Topic', dialogId: 'dialogAddTopic', lock: true, fixed: true, ext: {max: false}}">
        <table class="table table-bordered table-striped m_top6" style="width: 600px;" ng-form="tmp.addForm">
            <tr>
                <td width="20%">Name</td>
                <td>
                    <input type="text" ng-model="editOne.name" ui-valid="r"/>
                </td>
            </tr>
            <tr>
                <td>Partitions</td>
                <td>
                    <input type="text" ng-model="editOne.partitions"
                                           ui-valid="r int minval:int:1 maxval:int:256"
                                           style="width: 120px;"/>
                </td>
            </tr>
            <tr>
                <td>Replication Factor</td>
                <td>
                    <input type="text" ng-model="editOne.replicationFactor"
                                           ui-valid="r int minval:int:1 maxval:int:32"
                                           style="width: 120px;"/>
                </td>
            </tr>
            <tr>
                <td>Config Overrides</td>
                <td>
                    <div style="margin: 5px;">
                        <button class="btn" ng-click="editOne.configItems.items.push({})">Add One Item</button>
                    </div>
                    <div style="height: 200px; overflow-x: hidden;">
                        <div style="margin: 5px;" ng-repeat="param in editOne.configItems.items">
                            <span>Key&nbsp;<input type="text" ng-model="param.key"
                                                  style="width: 120px;"/></span>
                            <span>Value&nbsp;<input type="text" ng-model="param.value"
                                                    style="width: 150px;"/></span>
                            <span><button class="btn" ng-click="editOne.configItems.items.remove(param)"
                                          style="min-width: 20px;">-</button></span>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
        <button class="btn btn-blue" ng-click="saveAdd()">Save</button>
        <button class="btn" ng-click="ctrl.isShowAdd = false">Close</button>
    </script>

    <script type="text/x-template"
            ui-dialog="{showModel: 'ctrl.isShowAlter', title: 'Alter Kafka Topic', dialogId: 'dialogAlterTopic', lock: true, fixed: true, ext: {max: false}}">
        <table class="table table-bordered table-striped m_top6" style="width: 600px;" ng-form="tmp.alterForm">
            <tr>
                <td width="20%">Name</td>
                <td>{{alterOne.name}}</td>
            </tr>
            <tr>
                <td>Partitions</td>
                <td>
                    <input type="text" ng-model="alterOne.partitions"
                                           ui-valid="int minval:int:1 maxval:int:256"
                                           style="width: 120px;"/>
                    <span class="bg-gray">current: {{alterOne.currentPartitions}}</span>
                </td>
            </tr>
            <tr>
                <td>Config Overrides</td>
                <td>
                    <div style="margin: 5px;">
                        <button class="btn" ng-click="alterOne.configItems.items.push({})">Add One Item</button>
                    </div>
                    <div style="height: 200px; overflow-x: hidden;">
                        <div style="margin: 5px;" ng-repeat="param in alterOne.configItems.items">
                            <span>Key&nbsp;<input type="text" ng-model="param.key"
                                                  style="width: 120px;"/></span>
                            <span>Value&nbsp;<input type="text" ng-model="param.value"
                                                    style="width: 150px;"/></span>
                            <span><button class="btn" ng-click="alterOne.configItems.items.remove(param)"
                                          style="min-width: 20px;">-</button></span>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
        <button class="btn btn-blue" ng-click="saveAlter()">Save</button>
        <button class="btn" ng-click="ctrl.isShowAlter = false">Close</button>
    </script>
</div>
